server {
    listen 80;
    server_name localhost;
    client_max_body_size 2m;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
}
